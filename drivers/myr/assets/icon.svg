<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="Sun, cloud and rain">
  <g fill="#000">
    <!-- Sun and rays (upper-left, tucked behind the cloud). -->
    <g transform="translate(188,176)">
      <g stroke="#000" stroke-width="13" stroke-linecap="round">
        <line x1="0" y1="-98" x2="0" y2="-72"/>
        <line x1="69" y1="-69" x2="50" y2="-50"/>
        <line x1="98" y1="0"  x2="72" y2="0"/>
        <line x1="-69" y1="-69" x2="-50" y2="-50"/>
        <line x1="-98" y1="0"  x2="-72" y2="0"/>
        <line x1="-69" y1="69" x2="-50" y2="50"/>
        <line x1="0" y1="98" x2="0" y2="72"/>
      </g>
      <circle cx="0" cy="0" r="54"/>
    </g>

    <!-- Cloud (overlapping lobes + rounded base). -->
    <circle cx="250" cy="238" r="74"/>
    <circle cx="322" cy="272" r="60"/>
    <circle cx="182" cy="280" r="54"/>
    <rect x="155" y="280" width="212" height="62" rx="31"/>

    <!-- Three rain drops. -->
    <path d="M205 360 c0 0 -17 22 -17 33 a17 17 0 0 0 34 0 c0 -11 -17 -33 -17 -33 Z"/>
    <path d="M252 370 c0 0 -17 22 -17 33 a17 17 0 0 0 34 0 c0 -11 -17 -33 -17 -33 Z"/>
    <path d="M299 360 c0 0 -17 22 -17 33 a17 17 0 0 0 34 0 c0 -11 -17 -33 -17 -33 Z"/>
  </g>
</svg>
