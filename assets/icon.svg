    <rect x="364" y="42" width="52" height="126" rx="26"/>
    <rect x="169" y="128" width="52" height="126" rx="26" transform="rotate(-45 195 191)"/>
    <rect x="78" y="334" width="126" height="52" rx="26"/>
    <rect x="172" y="503" width="52" height="126" rx="26" transform="rotate(45 198 566)"/>
    <rect x="559" y="128" width="52" height="126" rx="26" transform="rotate(45 585 191)"/>

